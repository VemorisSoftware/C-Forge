<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>404 — Página no encontrada · C-Forge</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a;
      --text: #f4f4f5;
      --muted: #71717a;
      --orange: #FF6A32;
      --border: rgba(255,255,255,.08);
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text);
      text-decoration: none;
      margin-bottom: 48px;
    }
    .logo-mark {
      width: 32px; height: 32px;
      background: var(--orange);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: .75rem; font-weight: 900; color: #111;
      letter-spacing: -.5px;
    }

    /* Mascota */
    .forge-wrap {
      animation: float 3.5s ease-in-out infinite;
    }
    .forge-wrap svg .eye-lid {
      transform-box: fill-box;
      transform-origin: center;
      animation: forge-blink 4s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-14px); }
    }
    @keyframes forge-blink {
      0%,90%,100% { transform: scaleY(1); }
      94%          { transform: scaleY(0.05); }
    }
    @keyframes forge-look { 0%,40%{transform:translate(0,0)} 48%,58%{transform:translate(16px,0)} 66%,76%{transform:translate(-16px,0)} 84%,100%{transform:translate(0,0)} }
    .forge-pupil { transform-box:fill-box; transform-origin:center; animation:forge-look 7s ease-in-out infinite; }

    .code {
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 900;
      line-height: 1;
      color: var(--orange);
      letter-spacing: -4px;
      margin-top: 8px;
    }
    h1 {
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      font-weight: 700;
      margin-top: 16px;
      color: var(--text);
    }
    p {
      color: var(--muted);
      margin-top: 10px;
      font-size: 1rem;
      max-width: 380px;
    }
    .btn {
      margin-top: 36px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--orange);
      color: #111;
      font-weight: 700;
      font-size: .9rem;
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    footer {
      margin-top: 56px;
      color: var(--muted);
      font-size: .8rem;
    }
  </style>
</head>
<body>
  <a href="/" class="logo">
    <div class="logo-mark">CFv</div>
    C-Forge
  </a>

  <!-- Mascota Forge -->
  <div class="forge-wrap">
    <svg width="160" height="160" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
      <!-- Cabeza -->
      <rect x="75" y="75" width="250" height="250" rx="38" fill="#FF6A32"/>
      <!-- Ojo izquierdo -->
      <g class="eye-lid">
        <rect x="112" y="143" width="82" height="82" rx="12" fill="#FFFFFF"/>
        <rect class="forge-pupil" x="127" y="158" width="24" height="24" rx="5" fill="#181818"/>
      </g>
      <!-- Ojo derecho -->
      <g class="eye-lid">
        <rect x="206" y="143" width="82" height="82" rx="12" fill="#FFFFFF"/>
        <rect class="forge-pupil" x="221" y="158" width="24" height="24" rx="5" fill="#181818"/>
      </g>
      <!-- Boca -->
      <path d="M165 258 Q200 280 235 258" fill="none" stroke="#181818" stroke-width="12" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="code">404</div>
  <h1>Página no encontrada</h1>
  <p>Forge buscó por todas partes y no encontró nada aquí.</p>

  <a href="/" class="btn">← Volver al inicio</a>

  <footer>© 2026 Vemoris Software · C-Forge</footer>
</body>
</html>
