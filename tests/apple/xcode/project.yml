# Proyecto de Xcode de prueba (xcodegen): herramienta de macOS en Swift que
# usa calculos.cfv a través de la regla de cforge xcode-init.
name: Demo
options:
  bundleIdPrefix: org.c-forge
targets:
  Demo:
    type: tool
    platform: macOS
    deploymentTarget: "11.0"
    sources:
      - path: Fuentes/main.swift
      - path: Fuentes/calculos.cfv
        buildPhase: sources
    settings:
      base:
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        CODE_SIGNING_ALLOWED: NO
