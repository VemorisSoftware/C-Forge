<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Partículas en C-Forge (WebAssembly)</title>
  <style>
    html, body { margin: 0; background: #09090b; color: #f4f4f5; font: 16px/1.5 system-ui, sans-serif; }
    #lienzo { position: fixed; inset: 0; width: 100%; height: 100%; }
    main { position: relative; height: 300vh; padding: 12vh 8vw; pointer-events: none; }
    h1 { font-size: clamp(36px, 7vw, 84px); margin: 0; letter-spacing: -0.03em; }
    #motor { font: 12px ui-monospace, monospace; color: #a1a1aa; }
  </style>
</head>
<body>
  <canvas id="lienzo"></canvas>
  <main>
    <h1>Hecho con C-Forge.</h1>
    <p id="motor">cargando…</p>
    <p>Mueve el mouse y haz scroll.</p>
  </main>
  <script type="module">
    import { iniciar } from "./particulas.mjs";
    iniciar();
  </script>
</body>
</html>
