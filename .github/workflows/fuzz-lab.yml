# Fuzz Lab de Vemoris: ataca C-Forge sin parar y publica un reporte.
#
# Corre en tandas de 5,5 horas, una cada 6 horas, así que en la práctica no
# se detiene. Para PARARLO: Settings → Secrets and variables → Actions →
# Variables → crea FUZZ_LAB_ACTIVO con el valor "no". Para reanudarlo,
# bórrala o ponle "si".
#
# Si encuentra fallas, abre (o actualiza) un issue con la etiqueta fuzz-lab.
# Los reproductores quedan como artefacto de cada corrida.

name: Fuzz Lab

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      minutos:
        description: "Minutos de ataque (máximo 330)"
        required: false
        default: "330"

permissions:
  contents: read
  issues: write

concurrency:
  group: fuzz-lab
  cancel-in-progress: false

jobs:
  atacar:
    if: vars.FUZZ_LAB_ACTIVO != 'no'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: cforge desde la semilla
        run: make build

      - name: Atacar C-Forge
        id: lab
        continue-on-error: true
        env:
          MINUTOS: ${{ github.event.inputs.minutos || '330' }}
        run: sh tests/seguridad/fuzzlab/fuzzlab.sh "$MINUTOS" fuzzlab-salida

      - name: Guardar reporte y reproductores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-lab-${{ github.run_number }}
          path: fuzzlab-salida
          retention-days: 30

      - name: Publicar reporte en un issue
        if: steps.lab.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create fuzz-lab --color D93F0B --description "Fallas encontradas por el Fuzz Lab" --force
          {
            head -c 60000 fuzzlab-salida/REPORTE.md
            echo
            echo "---"
            echo "Reproductores: artefacto **fuzz-lab-${{ github.run_number }}** en ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > cuerpo.md
          numero=$(gh issue list --label fuzz-lab --state open --json number --jq '.[0].number')
          if [ -n "$numero" ]; then
            gh issue comment "$numero" --body-file cuerpo.md
          else
            gh issue create --title "🔬 Fuzz Lab: fallas encontradas en C-Forge" --label fuzz-lab --body-file cuerpo.md
          fi
