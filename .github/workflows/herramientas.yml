name: Herramientas (LSP, fmt y extensión de VS Code)

on:
  push:
    branches: [main, "herramientas/**"]
  pull_request:

jobs:
  lsp-y-vsix:
    name: cforge lsp + extensión .vsix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cforge desde la semilla (sin C++)
        run: make cforge-desde-semilla
      - name: Servidor de lenguaje (cforge lsp)
        run: python3 tests/lsp/prueba.py ./cforge-nativo
      - name: cforge fmt
        run: |
          ./cforge-nativo fmt --stdout tests/formato/entrada.cfv | cmp - tests/formato/esperado.cfv
          ./cforge-nativo fmt --check tests/formato/esperado.cfv
          echo "✓ cforge fmt"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Empaquetar la extensión (.vsix)
        working-directory: herramientas/vscode-cforgev
        run: |
          npm ci --no-audit --no-fund
          npx --yes @vscode/vsce package -o ../../cforge-vscode.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: cforge-vscode-vsix
          path: cforge-vscode.vsix

