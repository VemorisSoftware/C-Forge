name: Herramientas (LSP, fmt y extensión de VS Code)

on:
  push:
    branches: [main, "herramientas/**", "trabajo/**"]
  pull_request:

jobs:
  lsp-y-vsix:
    name: cforge lsp + extensión .vsix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cforge desde la semilla (sin C++)
        run: make cforge-desde-semilla
      - name: Servidor de lenguaje (cforge lsp)
        run: python3 tests/lsp/prueba.py ./cforge
      - name: cforge fmt
        run: |
          ./cforge fmt --stdout tests/formato/entrada.cfv | cmp - tests/formato/esperado.cfv
          ./cforge fmt --check tests/formato/esperado.cfv
          echo "✓ cforge fmt"
      - name: Navegador real (Chromium + Playwright)
        run: |
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          python3 tests/navegador/prueba.py ./cforge
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Paquetes npm desde C-Forge (WebAssembly + Node.js)
        run: sh tests/npm/prueba.sh ./cforge
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Java (JNI) y C# (.NET) dentro de C-Forge
        run: sh tests/interop/prueba.sh ./cforge
      - name: Empaquetar la extensión (.vsix)
        working-directory: herramientas/vscode-cforgev
        run: |
          npm ci --no-audit --no-fund
          npx --yes @vscode/vsce package -o ../../cforge-vscode.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: cforge-vscode-vsix
          path: cforge-vscode.vsix

