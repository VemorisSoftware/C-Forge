name: Prueba temporal de WinGet
on:
  push:
    branches: ["prueba/winget-*"]
jobs:
  winget:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: winget validate + install --manifest
        shell: pwsh
        run: |
          winget --version
          winget source remove msstore
          $m = "prueba-winget/manifests/v/VemorisSoftware/CForgeLang/5.0.0"
          winget validate --manifest $m
          winget settings --enable LocalManifestFiles
          winget install --manifest $m --accept-package-agreements --accept-source-agreements --disable-interactivity
          $links = "$env:LOCALAPPDATA\Microsoft\WinGet\Links"
          Get-ChildItem $links
          & "$links\cforge.exe" --version
          Set-Content -Path hola.cfv -Value 'importar "json"', 'mostrar(json_serializar({"so": sys_info()["sistema"], "ok": [1, 2] == [1, 2]}))'
          $s = & "$links\cforge.exe" hola.cfv
          Write-Output $s
          if ($s -ne '{"ok":true,"so":"windows"}') { exit 1 }
          winget uninstall --id VemorisSoftware.CForgeLang --disable-interactivity
