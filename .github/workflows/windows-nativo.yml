name: Windows nativo (PE64 100 % C-Forge)

on:
  push:
    branches: [main, "nativo/**"]
  pull_request:

jobs:
  cruzado:
    name: Compilación cruzada Linux → Windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cforge.exe y pruebas para Windows
        run: |
          make windows-cruzado
          make macos-cruzado macos-arm64-cruzado
          mkdir -p dist-windows/macos
          cp dist-macos/cforge dist-windows/macos/cforge-x64
          cp dist-macos-arm64/cforge dist-windows/macos/cforge-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist-windows/

  windows:
    name: Windows x64 (Stage 2 = Stage 3)
    needs: cruzado
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-windows
          path: dist-windows/

      - name: Pruebas del dialecto nativo como .exe
        run: |
          fallas=0
          for prueba in 01_memoria 02_textos 03_listas; do
            ./dist-windows/pruebas/$prueba.exe > salida.txt; codigo=$?
            if diff -u tests/nativo/$prueba.salida salida.txt; then echo "✓ $prueba.exe"; else echo "✗ $prueba.exe (código $codigo)"; fallas=1; fi
          done
          ./dist-windows/pruebas/04_prueba_de_fuego.exe tests/nativo/fixtures/entrada.cfv reporte.txt; echo "código $?"
          if diff -u tests/nativo/fixtures/reporte.esperado reporte.txt; then echo "✓ prueba de fuego"; else fallas=1; fi
          exit $fallas

      - name: cforge.exe se compila a sí mismo (Stage 2 = Stage 3)
        run: |
          set -e
          ./dist-windows/cforge.exe --version
          F="runtime/sys_windows.cfv runtime/mem.cfv runtime/str.cfv runtime/vec.cfv runtime/io.cfv runtime/f64.cfv bootstrap/nativo/lexer.cfv bootstrap/nativo/cforge_self.cfv bootstrap/nativo/gen.cfv bootstrap/nativo/gen_x64.cfv bootstrap/nativo/gen_a64.cfv bootstrap/nativo/gen_wasm.cfv bootstrap/nativo/biblioteca_c.cfv bootstrap/nativo/embebido.cfv bootstrap/nativo/paquetes.cfv bootstrap/nativo/formato.cfv bootstrap/nativo/lsp.cfv bootstrap/nativo/xcode.cfv bootstrap/nativo/cforge_cli.cfv"
          ./dist-windows/cforge.exe -o stage2.exe --target windows $F
          ./stage2.exe -o stage3.exe --target windows $F
          cmp stage2.exe stage3.exe
          cmp stage2.exe dist-windows/cforge.exe
          sha256sum stage2.exe stage3.exe dist-windows/cforge.exe
          echo "✓ Windows: Stage 2 = Stage 3 = compilación cruzada desde Linux"
          M="runtime/sys_macos.cfv runtime/mem.cfv runtime/str.cfv runtime/vec.cfv runtime/io.cfv runtime/f64.cfv bootstrap/nativo/lexer.cfv bootstrap/nativo/cforge_self.cfv bootstrap/nativo/gen.cfv bootstrap/nativo/gen_x64.cfv bootstrap/nativo/gen_a64.cfv bootstrap/nativo/gen_wasm.cfv bootstrap/nativo/biblioteca_c.cfv bootstrap/nativo/embebido.cfv bootstrap/nativo/paquetes.cfv bootstrap/nativo/formato.cfv bootstrap/nativo/lsp.cfv bootstrap/nativo/xcode.cfv bootstrap/nativo/cforge_cli.cfv"
          ./dist-windows/cforge.exe -o mac-x64 --target macos $M
          ./dist-windows/cforge.exe -o mac-arm64 --target macos-arm64 $M
          cmp mac-x64 dist-windows/macos/cforge-x64
          cmp mac-arm64 dist-windows/macos/cforge-arm64
          sha256sum mac-x64 mac-arm64
          echo "✓ Desde Windows: Mach-O x86-64 y ARM64 idénticos a los compilados desde Linux"

      - name: Suite del lenguaje con cforge.exe
        run: |
          export CFORGE_STDLIB="$PWD/stdlib"
          ok=0; total=0; fallas=""
          for t in tests/cfv/*.cfv; do
            total=$((total + 1))
            if ./dist-windows/cforge.exe "$t" 2>err.txt | grep -q '^\[OK\]'; then ok=$((ok + 1)); else fallas="$fallas $(basename $t)"; echo "✗ $t: $(head -c 200 err.txt)"; fi
          done
          echo "tests/cfv en Windows: $ok/$total"
          echo "pendientes:$fallas"

      - name: Hilos, extern y CLI en Windows
        run: |
          export CFORGE_STDLIB="$PWD/stdlib"
          fallas=0
          ./dist-windows/cforge.exe tests/nativo/12_hilos.cfv > hilos.txt; echo "código $?"
          if diff -u tests/nativo/12_hilos.salida hilos.txt; then echo "✓ hilos (CreateThread)"; else fallas=1; fi
          ./dist-windows/cforge.exe build tests/cfv/01_nucleo.cfv -o nucleo.exe && ./nucleo.exe | grep -q '^\[OK\]' && echo "✓ cforge build → .exe" || fallas=1
          ./dist-windows/cforge.exe check tests/cfv/08_clases.cfv || fallas=1
          ./dist-windows/cforge.exe --version
          exit $fallas

      - name: SDL2.dll oficial (libsdl-org) para los ejemplos gráficos
        run: |
          curl -sSL -o sdl2.zip https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-2.30.9-win32-x64.zip
          unzip -o -q sdl2.zip SDL2.dll -d dist-windows/
          ls -la dist-windows/SDL2.dll

      - name: ejemplos/ con cforge.exe (servidor HTTP con Winsock, SDL2)
        run: |
          export PATH="$PWD/dist-windows:$PATH"
          sh tests/nativo/ejemplos.sh dist-windows/cforge.exe

      - name: Gestor de paquetes (init, add, install, importar)
        run: sh tests/paquetes/prueba.sh dist-windows/cforge.exe

      - name: Servidor de lenguaje (cforge lsp)
        run: python3 tests/lsp/prueba.py dist-windows/cforge.exe || python tests/lsp/prueba.py dist-windows/cforge.exe

      - name: OpenGL 3.3 (compila; el runner no tiene GPU)
        shell: bash
        run: |
          export CFORGE_STDLIB="$PWD/stdlib"
          dist-windows/cforge.exe build tests/gl/prueba.cfv -o gl-prueba

      - name: Recolector de basura (memoria acotada y suite en estrés)
        shell: bash
        run: |
          export CFORGE_STDLIB="$PWD/stdlib"
          dist-windows/cforge.exe tests/memoria/prueba.cfv | grep '^\[OK\]'
          for t in tests/cfv/*.cfv; do CFORGE_GC_ESTRES=1 dist-windows/cforge.exe "$t" | grep -q '^\[OK\]' || { echo "✗ $t"; exit 1; }; done
          echo "✓ suite en modo estrés"

      - name: Verificador de tipos
        shell: bash
        run: |
          export CFORGE_STDLIB="$PWD/stdlib"
          cd tests/tipos
          for f in error_*.cfv; do { ../../dist-windows/cforge.exe check $f 2>&1 || true; } | head -1 | tr -d '\r' | sed 's|^\[C-Forge\] ||'; done | diff -u errores.esperados -
          ../../dist-windows/cforge.exe valido.cfv | grep '^\[OK\]'

      - name: Modo --release (sin código muerto)
        shell: bash
        run: |
          export CFORGE_STDLIB="$PWD/stdlib"
          echo 'mostrar("hola")' > hola.cfv
          dist-windows/cforge.exe build hola.cfv --release -o hola.exe
          ./hola.exe | grep -q hola
          tam=$(wc -c < hola.exe); echo "hola --release: $tam bytes"; [ $tam -lt 81920 ]
          for t in tests/cfv/*.cfv; do dist-windows/cforge.exe build "$t" --release -o p.exe >/dev/null; (cd tests/cfv && ../../p.exe) | grep -q '^\[OK\]' || { echo "✗ $t"; exit 1; }; done
          dist-windows/cforge.exe build benchmarks/07_enteros_primos_fib.cfv --release -o b.exe
          time ./b.exe

      - name: cforge repl
        shell: bash
        run: |
          export CFORGE_STDLIB="$PWD/stdlib"
          dist-windows/cforge.exe repl < tests/repl/entrada.txt 2>&1 | tr -d '\r' | tail -n +2 | diff -u tests/repl/esperado.txt -

      - name: Base de datos (SQLite del sistema)
        shell: bash
        run: |
          export CFORGE_STDLIB="$PWD/stdlib"
          d=$(mktemp -d); raiz=$PWD
          (cd "$d" && "$raiz/dist-windows/cforge.exe" "$raiz/tests/db/prueba.cfv") | tr -d '\r' | diff -u tests/db/prueba.salida -

      - name: Red (HTTP, UDP, Redis, DNS) y HTTPS con Schannel
        shell: bash
        env:
          CFORGE_TLS_INTERNET: "1"
        run: |
          export CFORGE_STDLIB="$PWD/stdlib"
          python tests/red/prueba.py dist-windows/cforge.exe

      - name: Ejemplos del sitio con cforge.exe
        run: |
          export CFORGE_STDLIB="$PWD/stdlib"
          ok=0; total=0
          for e in site/ejemplos/*.cfv site/ejemplos/en/*.cfv; do
            total=$((total + 1))
            if ./dist-windows/cforge.exe "$e" 2>/dev/null | diff -q "${e%.cfv}.salida" - >/dev/null; then ok=$((ok + 1)); else echo "✗ $e"; fi
          done
          echo "ejemplos del sitio en Windows: $ok/$total"
          [ "$ok" = "$total" ]
