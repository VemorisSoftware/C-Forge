name: Seguridad continua

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  # Entradas dañadas o aleatorias no deben colgar ni romper el compilador.
  fuzz-smoke:
    name: Fuzz smoke (cforge 100 % C-Forge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cforge desde la semilla
        run: make build

      - name: Entradas inválidas fallan limpio
        shell: bash
        run: |
          for prog in \
            'mostrar("hola")' \
            'sea x: numero = 1 + 2  mostrar(x)' \
            'si (verdadero) { mostrar("ok") }' \
            'funcion f(n: numero): numero { retornar n * 2 }  mostrar(f(5))' \
            '}{invalid{{}' \
            '@@@@' \
            '"sin cerrar' \
            'funcion f() { clase Interna { sea x } }' \
            'funcion g() { sea r = [] r = 5 clase retornar 1' \
            'interfaz Volador' \
            'clase Sin' \
            'retornar 5' \
            'mostrar(1) retornar {"estado": 400}' \
            '' ; do
            echo "$prog" > /tmp/fuzz_case.cfv
            codigo=0; timeout 20 ./cforge /tmp/fuzz_case.cfv >/dev/null 2>&1 || codigo=$?
            if [ $codigo -ge 124 ]; then echo "✗ se colgó o abortó ($codigo): $prog"; exit 1; fi
          done
          # Bytes aleatorios.
          for i in $(seq 1 30); do
            head -c 400 /dev/urandom > /tmp/fuzz_bin.cfv
            codigo=0; timeout 20 ./cforge /tmp/fuzz_bin.cfv >/dev/null 2>&1 || codigo=$?
            if [ $codigo -ge 124 ]; then echo "✗ se colgó o abortó ($codigo) con entrada aleatoria"; exit 1; fi
          done
          echo 'mostrar("fuzz OK")' > /tmp/fuzz_valid.cfv
          ./cforge /tmp/fuzz_valid.cfv

      - name: Funciones internas del runtime bloqueadas
        shell: bash
        run: |
          # Llamar a una función interna desde un programa es un error de
          # compilación limpio (antes cerraba el programa con un segfault).
          for f in 'dyn_dato(5)' 'aes_xtime(5)' 'tls_f("x")'; do
            echo "mostrar($f)" > /tmp/interna.cfv
            codigo=0; ./cforge /tmp/interna.cfv > /tmp/interna.txt 2>&1 || codigo=$?
            if [ $codigo -ne 1 ] || ! grep -q "función interna del runtime" /tmp/interna.txt; then
              echo "✗ $f: código $codigo"; cat /tmp/interna.txt; exit 1
            fi
          done
          echo "✓ funciones internas bloqueadas"

      - name: Fuzz por mutaciones
        run: sh tests/seguridad/fuzz_mutaciones.sh ./cforge 300

      - name: Semilla íntegra
        run: (cd bootstrap/semilla && sha256sum -c cforge-linux-x64.sha256)
