name: Seguridad continua

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  # Entradas dañadas o aleatorias no deben colgar ni romper el compilador.
  fuzz-smoke:
    name: Fuzz smoke (cforge 100 % C-Forge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cforge desde la semilla
        run: make build

      - name: Entradas inválidas fallan limpio
        shell: bash
        run: |
          for prog in \
            'mostrar("hola")' \
            'sea x: numero = 1 + 2  mostrar(x)' \
            'si (verdadero) { mostrar("ok") }' \
            'funcion f(n: numero): numero { retornar n * 2 }  mostrar(f(5))' \
            '}{invalid{{}' \
            '@@@@' \
            '"sin cerrar' \
            '' ; do
            echo "$prog" > /tmp/fuzz_case.cfv
            codigo=0; timeout 20 ./cforge /tmp/fuzz_case.cfv >/dev/null 2>&1 || codigo=$?
            if [ $codigo -ge 124 ]; then echo "✗ se colgó o abortó ($codigo): $prog"; exit 1; fi
          done
          # Bytes aleatorios.
          for i in $(seq 1 30); do
            head -c 400 /dev/urandom > /tmp/fuzz_bin.cfv
            codigo=0; timeout 20 ./cforge /tmp/fuzz_bin.cfv >/dev/null 2>&1 || codigo=$?
            if [ $codigo -ge 124 ]; then echo "✗ se colgó o abortó ($codigo) con entrada aleatoria"; exit 1; fi
          done
          echo 'mostrar("fuzz OK")' > /tmp/fuzz_valid.cfv
          ./cforge /tmp/fuzz_valid.cfv

      - name: Semilla íntegra
        run: (cd bootstrap/semilla && sha256sum -c cforge-linux-x64.sha256)
