name: macOS nativo (Mach-O x86-64 y ARM64, 100 % C-Forge)

on:
  push:
    branches: [main, "nativo/**"]
  pull_request:

jobs:
  cruzado:
    name: Compilación cruzada Linux → macOS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cforge (Mach-O x86-64) y pruebas para macOS Intel
        run: make macos-cruzado
      - name: cforge (Mach-O ARM64 firmado) y pruebas para Apple Silicon
        run: make macos-arm64-cruzado
      - name: Linux ARM64 con qemu (mismo backend AArch64)
        run: |
          sudo apt-get install -y -q qemu-user >/dev/null
          make linux-arm64-check
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist-macos/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-arm64
          path: dist-macos-arm64/

  macos:
    name: macOS ${{ matrix.nombre }} (Stage 2 = Stage 3)
    needs: cruzado
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            nombre: x86-64 (Intel)
          - runner: macos-latest
            nombre: x86-64 en Apple Silicon (Rosetta 2)
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-macos
          path: dist-macos/
      - name: Preparar
        run: |
          chmod +x dist-macos/cforge dist-macos/pruebas/*
          uname -a
          if [ "$(uname -m)" = arm64 ]; then softwareupdate --install-rosetta --agree-to-license >/dev/null 2>&1 || true; fi
          command -v gtimeout >/dev/null || brew install coreutils >/dev/null 2>&1 || true

      - name: Pruebas del dialecto nativo
        run: |
          fallas=0
          for prueba in 01_memoria 02_textos 03_listas; do
            ./dist-macos/pruebas/$prueba > salida.txt; codigo=$?
            if diff -u tests/nativo/$prueba.salida salida.txt; then echo "✓ $prueba"; else echo "✗ $prueba (código $codigo)"; fallas=1; fi
          done
          ./dist-macos/pruebas/04_prueba_de_fuego tests/nativo/fixtures/entrada.cfv reporte.txt; echo "código $?"
          if diff -u tests/nativo/fixtures/reporte.esperado reporte.txt; then echo "✓ prueba de fuego"; else fallas=1; fi
          exit $fallas

      - name: cforge se compila a sí mismo en macOS (Stage 2 = Stage 3)
        run: |
          set -e
          ./dist-macos/cforge --version
          F="runtime/sys_macos.cfv runtime/mem.cfv runtime/str.cfv runtime/vec.cfv runtime/io.cfv runtime/f64.cfv bootstrap/nativo/lexer.cfv bootstrap/nativo/cforge_self.cfv bootstrap/nativo/gen.cfv bootstrap/nativo/gen_x64.cfv bootstrap/nativo/gen_a64.cfv bootstrap/nativo/biblioteca_c.cfv bootstrap/nativo/embebido.cfv bootstrap/nativo/paquetes.cfv bootstrap/nativo/formato.cfv bootstrap/nativo/lsp.cfv bootstrap/nativo/cforge_cli.cfv"
          ./dist-macos/cforge -o stage2 --target macos $F
          ./stage2 -o stage3 --target macos $F
          cmp stage2 stage3
          cmp stage2 dist-macos/cforge
          shasum -a 256 stage2 stage3 dist-macos/cforge
          echo "✓ macOS: Stage 2 = Stage 3 = compilación cruzada desde Linux"

      - name: Suite del lenguaje
        run: |
          export CFORGE_STDLIB="$PWD/stdlib"
          ok=0; total=0
          for t in tests/cfv/*.cfv; do
            total=$((total + 1))
            if ./dist-macos/cforge "$t" 2>err.txt | grep -q '^\[OK\]'; then ok=$((ok + 1)); else echo "✗ $t: $(head -c 200 err.txt)"; fi
          done
          echo "tests/cfv en macOS: $ok/$total"
          [ "$ok" = "$total" ]

      - name: Hilos y CLI
        run: |
          export CFORGE_STDLIB="$PWD/stdlib"
          ./dist-macos/cforge tests/nativo/12_hilos.cfv > hilos.txt
          diff -u tests/nativo/12_hilos.salida hilos.txt && echo "✓ hilos (pthread)"
          ./dist-macos/cforge build tests/cfv/01_nucleo.cfv -o nucleo && ./nucleo | grep -q '^\[OK\]' && echo "✓ cforge build"

      - name: Ejemplos del sitio
        run: |
          export CFORGE_STDLIB="$PWD/stdlib"
          ok=0; total=0
          for e in site/ejemplos/*.cfv site/ejemplos/en/*.cfv; do
            total=$((total + 1))
            if ./dist-macos/cforge "$e" 2>/dev/null | diff -q "${e%.cfv}.salida" - >/dev/null; then ok=$((ok + 1)); else echo "✗ $e"; fi
          done
          echo "ejemplos del sitio en macOS: $ok/$total"
          [ "$ok" = "$total" ]

      - name: Puente con Objective-C (stdlib/apple.cfv, x86-64)
        run: |
          export CFORGE_STDLIB="$PWD/stdlib"
          ./dist-macos/cforge tests/apple/objc.cfv | diff -u tests/apple/objc.salida -

      - name: ejemplos/ (servidor HTTP, hilos, SDL2 si está)
        run: |
          brew install sdl2 >/dev/null 2>&1 || true
          export PATH="$(brew --prefix coreutils)/libexec/gnubin:$PATH"
          sh tests/nativo/ejemplos.sh dist-macos/cforge

  arm64:
    name: macOS ARM64 nativo en Apple Silicon (Stage 2 = Stage 3)
    needs: cruzado
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-macos-arm64
          path: dist-macos-arm64/
      - name: Preparar
        run: |
          chmod +x dist-macos-arm64/cforge dist-macos-arm64/pruebas/*
          uname -a
          file dist-macos-arm64/cforge
          codesign -dv dist-macos-arm64/cforge 2>&1 | head -5 || true
          brew install coreutils sdl2 >/dev/null 2>&1 || true

      - name: Pruebas del dialecto nativo
        run: |
          fallas=0
          for prueba in 01_memoria 02_textos 03_listas; do
            ./dist-macos-arm64/pruebas/$prueba > salida.txt; codigo=$?
            if diff -u tests/nativo/$prueba.salida salida.txt; then echo "✓ $prueba"; else echo "✗ $prueba (código $codigo)"; fallas=1; fi
          done
          ./dist-macos-arm64/pruebas/04_prueba_de_fuego tests/nativo/fixtures/entrada.cfv reporte.txt; echo "código $?"
          if diff -u tests/nativo/fixtures/reporte.esperado reporte.txt; then echo "✓ prueba de fuego"; else fallas=1; fi
          exit $fallas

      - name: cforge se compila a sí mismo en Apple Silicon (Stage 2 = Stage 3)
        run: |
          set -e
          ./dist-macos-arm64/cforge --version
          F="runtime/sys_macos.cfv runtime/mem.cfv runtime/str.cfv runtime/vec.cfv runtime/io.cfv runtime/f64.cfv bootstrap/nativo/lexer.cfv bootstrap/nativo/cforge_self.cfv bootstrap/nativo/gen.cfv bootstrap/nativo/gen_x64.cfv bootstrap/nativo/gen_a64.cfv bootstrap/nativo/biblioteca_c.cfv bootstrap/nativo/embebido.cfv bootstrap/nativo/paquetes.cfv bootstrap/nativo/formato.cfv bootstrap/nativo/lsp.cfv bootstrap/nativo/cforge_cli.cfv"
          ./dist-macos-arm64/cforge -o stage2 $F
          ./stage2 -o stage3 $F
          cmp stage2 stage3
          cmp stage2 dist-macos-arm64/cforge
          ./dist-macos-arm64/cforge -o x64 --target macos $F
          shasum -a 256 stage2 stage3 dist-macos-arm64/cforge x64
          codesign -v stage2 && echo "✓ firma ad-hoc válida (codesign -v)"
          echo "✓ Apple Silicon: Stage 2 = Stage 3 = compilación cruzada desde Linux"

      - name: Suite del lenguaje
        run: |
          export CFORGE_STDLIB="$PWD/stdlib"
          ok=0; total=0
          for t in tests/cfv/*.cfv; do
            total=$((total + 1))
            if ./dist-macos-arm64/cforge "$t" 2>err.txt | grep -q '^\[OK\]'; then ok=$((ok + 1)); else echo "✗ $t: $(head -c 200 err.txt)"; fi
          done
          echo "tests/cfv en Apple Silicon: $ok/$total"
          [ "$ok" = "$total" ]

      - name: Hilos y CLI
        run: |
          export CFORGE_STDLIB="$PWD/stdlib"
          ./dist-macos-arm64/cforge tests/nativo/12_hilos.cfv > hilos.txt
          diff -u tests/nativo/12_hilos.salida hilos.txt && echo "✓ hilos (pthread)"
          ./dist-macos-arm64/cforge build tests/cfv/01_nucleo.cfv -o nucleo && ./nucleo | grep -q '^\[OK\]' && echo "✓ cforge build"

      - name: Ejemplos del sitio
        run: |
          export CFORGE_STDLIB="$PWD/stdlib"
          ok=0; total=0
          for e in site/ejemplos/*.cfv site/ejemplos/en/*.cfv; do
            total=$((total + 1))
            if ./dist-macos-arm64/cforge "$e" 2>/dev/null | diff -q "${e%.cfv}.salida" - >/dev/null; then ok=$((ok + 1)); else echo "✗ $e"; fi
          done
          echo "ejemplos del sitio en Apple Silicon: $ok/$total"
          [ "$ok" = "$total" ]

      - name: ejemplos/ (servidor HTTP, hilos, SDL2 de Homebrew)
        run: |
          export PATH="$(brew --prefix coreutils)/libexec/gnubin:$PATH"
          sh tests/nativo/ejemplos.sh dist-macos-arm64/cforge

      - name: Gestor de paquetes (init, add, install, importar)
        run: sh tests/paquetes/prueba.sh dist-macos-arm64/cforge

      - name: Servidor de lenguaje (cforge lsp)
        run: python3 tests/lsp/prueba.py dist-macos-arm64/cforge || python tests/lsp/prueba.py dist-macos-arm64/cforge

      - name: Puente con Objective-C (stdlib/apple.cfv)
        run: |
          export CFORGE_STDLIB="$PWD/stdlib"
          ./dist-macos-arm64/cforge tests/apple/objc.cfv | diff -u tests/apple/objc.salida -
          echo "✓ objc_getClass / sel_registerName / objc_msgSend desde C-Forge"

      - name: Biblioteca para Xcode (--lib) desde C y Swift
        run: |
          export CFORGE_STDLIB="$PWD/stdlib"
          cd tests/apple
          ../../dist-macos-arm64/cforge build calculos.cfv --lib -o libcalculos.a
          clang main.c -L. -lcalculos -o con_c
          ./con_c | diff -u main_c.salida -
          swiftc -import-objc-header calculos.h main.swift -L. -lcalculos -o con_swift
          ./con_swift | diff -u main_swift.salida -
          echo "✓ --lib: libcalculos.a + calculos.h usados desde C y Swift"

      - name: iOS ARM64 (dispositivo y simulador)
        run: |
          export CFORGE_STDLIB="$PWD/stdlib"
          cd tests/apple
          mkdir -p ios sim
          ../../dist-macos-arm64/cforge build calculos.cfv --lib --target ios-arm64 -o ios/libcalculos.a
          ../../dist-macos-arm64/cforge build calculos.cfv --lib --target ios-sim-arm64 -o sim/libcalculos.a
          xcrun --sdk iphoneos clang -target arm64-apple-ios14.0 main.c -Lios -lcalculos -o ios/app
          file ios/app
          xcrun --sdk iphonesimulator clang -target arm64-apple-ios14.0-simulator main.c -Lsim -lcalculos -o sim/app
          echo "✓ enlazado contra los SDK de iOS (dispositivo y simulador)"
          dispositivo=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          xcrun simctl boot "$dispositivo" || true
          xcrun simctl spawn "$dispositivo" "$PWD/sim/app" | diff -u main_c.salida -
          echo "✓ la biblioteca de C-Forge corre en el simulador de iOS"
