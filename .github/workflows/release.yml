name: C-Forge Release

on:
  push:
    tags: ["v*"]
    # Publicación automática: al subir a main un cambio de VERSION en el
    # Makefile, se publica esa versión si todavía no existe su release.
    branches: [main]
    paths: [Makefile]
  workflow_dispatch:

permissions:
  contents: write

# C-Forge 100 % C-Forge: la semilla compila cforge en Linux y cforge compila,
# de forma cruzada y byte por byte reproducible, los binarios de todas las
# plataformas. macOS y Windows reales verifican los paquetes antes de publicar.
jobs:
  # ── 0. Versión: tag = Makefile = binario ───────────────────────────────────
  validate-version:
    name: Validar versión
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Determinar versión
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V=$(grep '^VERSION' Makefile | head -1 | sed 's/VERSION[[:space:]]*:=[[:space:]]*//')
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "El release v$V ya existe; no se publica de nuevo."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: cforge desde la semilla
        run: make build

      - name: Verificar versión en Makefile y binario
        run: |
          TAG="${{ steps.ver.outputs.version }}"
          MF=$(grep '^VERSION' Makefile | head -1 | sed 's/VERSION[[:space:]]*:=[[:space:]]*//')
          BIN=$(./cforge --version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "Tag: $TAG · Makefile: $MF · Binario: $BIN"
          [ "$TAG" = "$MF" ] && [ "$TAG" = "$BIN" ] || { echo "ERROR: versiones distintas"; exit 1; }
          echo "OK — versión $TAG consistente"

  # ── 1. Gate completo + binarios de todas las plataformas (desde Linux) ─────
  build:
    name: Gate + binarios (Linux, Windows, macOS)
    needs: validate-version
    if: needs.validate-version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de las pruebas y del empaquetado
        run: sudo apt-get update -qq && sudo apt-get install -y libsdl2-2.0-0 libsqlite3-0 curl qemu-user dpkg-dev zip

      - name: Gate completo (release-check)
        run: make release-check

      - name: Binarios de las demás plataformas (compilación cruzada)
        run: |
          make windows-cruzado macos-cruzado macos-arm64-cruzado linux-arm64-cruzado
          make linux-arm64-check

      - name: Empaquetar
        run: |
          set -e
          empaquetar() {   # plataforma binario
            d="pkg/cforge-${VERSION}-$1"
            mkdir -p "$d"
            cp "$2" "$d/"
            cp -r stdlib README.md LICENSE "$d/"
          }
          empaquetar linux-x64 cforge
          empaquetar linux-arm64 dist-linux-arm64/cforge
          empaquetar macos-arm64 dist-macos-arm64/cforge
          empaquetar macos-x64 dist-macos/cforge
          empaquetar windows-x64 dist-windows/cforge.exe
          for p in linux-x64 linux-arm64 macos-arm64 macos-x64; do cp install.sh "pkg/cforge-${VERSION}-$p/"; done
          cp install.ps1 "pkg/cforge-${VERSION}-windows-x64/"
          cd pkg
          for p in linux-x64 linux-arm64 macos-arm64 macos-x64; do tar czf "cforge-${VERSION}-$p.tar.gz" "cforge-${VERSION}-$p/"; done
          zip -qr "cforge-${VERSION}-windows-x64.zip" "cforge-${VERSION}-windows-x64/"
          cd ..
          bash packaging/debian/build-deb.sh "${VERSION}" amd64 cforge
          bash packaging/debian/build-deb.sh "${VERSION}" arm64 dist-linux-arm64/cforge
          ls -la pkg/*.tar.gz pkg/*.zip dist/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: paquetes
          path: |
            pkg/*.tar.gz
            pkg/*.zip
            dist/*.deb
          if-no-files-found: error

  # ── 2. Verificación en macOS (Apple Silicon) ───────────────────────────────
  verify-macos:
    name: Verificar en macOS (Apple Silicon)
    needs: [validate-version, build]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.validate-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: paquetes
          path: paquetes
      - name: Paquete macos-arm64
        run: |
          set -e
          tar xzf "paquetes/pkg/cforge-${VERSION}-macos-arm64.tar.gz"
          C="$PWD/cforge-${VERSION}-macos-arm64/cforge"
          export CFORGE_STDLIB="$PWD/cforge-${VERSION}-macos-arm64/stdlib"
          "$C" --version | grep -q "${VERSION}"
          codesign -v "$C"
          "$C" tests/cfv/01_nucleo.cfv | grep -q '^\[OK\]'
          "$C" build tests/cfv/02_funciones.cfv -o /tmp/f && /tmp/f | grep -q '^\[OK\]'
          echo "✓ cforge macos-arm64 ${VERSION}"

  # ── 3. Verificación en Windows ─────────────────────────────────────────────
  verify-windows:
    name: Verificar en Windows x64
    needs: [validate-version, build]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.validate-version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: paquetes
          path: paquetes
      - name: Paquete windows-x64
        run: |
          set -e
          unzip -q "paquetes/pkg/cforge-${VERSION}-windows-x64.zip"
          C="$PWD/cforge-${VERSION}-windows-x64/cforge.exe"
          export CFORGE_STDLIB="$PWD/cforge-${VERSION}-windows-x64/stdlib"
          "$C" --version | grep -q "${VERSION}"
          "$C" tests/cfv/01_nucleo.cfv | grep -q '^\[OK\]'
          echo "✓ cforge windows-x64 ${VERSION}"

  # ── 4. Extensión de VS Code (.vsix) ────────────────────────────────────────
  build-vsix:
    name: Extensión de VS Code
    needs: validate-version
    if: needs.validate-version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build .vsix
        working-directory: herramientas/vscode-cforgev
        run: |
          npm ci --no-audit --no-fund
          npx --yes @vscode/vsce package --out "c-forge-${VERSION}.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: herramientas/vscode-cforgev/c-forge-${{ env.VERSION }}.vsix
          if-no-files-found: error

  # ── 5. Publicar ────────────────────────────────────────────────────────────
  publish-release:
    name: Publicar Release
    needs: [validate-version, build, verify-macos, verify-windows, build-vsix]
    if: needs.validate-version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Descargar todos los artefactos
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Aplanar y listar artefactos
        run: |
          find release-assets -mindepth 2 -type f -exec mv {} release-assets/ \;
          find release-assets -mindepth 1 -type d -empty -delete
          ls -la release-assets

      - name: Generar SHA-256
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Generar release-manifest.json y latest.json
        run: |
          VERSION="${{ env.VERSION }}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BASE="https://github.com/VemorisSoftware/cforge/releases/download/v${VERSION}"
          sha() { grep " $1\$" release-assets/SHA256SUMS | awk '{print $1}' | head -1; }
          archivo() {   # tipo nombre
            printf '{"type": "%s", "filename": "%s", "url": "%s/%s", "sha256": "%s"}' "$1" "$2" "$BASE" "$2" "$(sha "$2")"
          }
          cat > release-assets/release-manifest.json <<EOF
          {
            "schema": 1,
            "version": "${VERSION}",
            "channel": "stable",
            "released_at": "${DATE}",
            "minimum_supported_version": null,
            "install_script": "https://raw.githubusercontent.com/VemorisSoftware/cforge/main/install.sh",
            "changelog": "https://github.com/VemorisSoftware/cforge/blob/main/CHANGELOG.md",
            "downloads": {
              "macos": {
                "arm64": {"archive": $(archivo tar.gz "cforge-${VERSION}-macos-arm64.tar.gz")},
                "x64": {"archive": $(archivo tar.gz "cforge-${VERSION}-macos-x64.tar.gz")}
              },
              "linux": {
                "x64": {"archive": $(archivo tar.gz "cforge-${VERSION}-linux-x64.tar.gz"), "package": $(archivo deb "cforge_${VERSION}_amd64.deb")},
                "arm64": {"archive": $(archivo tar.gz "cforge-${VERSION}-linux-arm64.tar.gz"), "package": $(archivo deb "cforge_${VERSION}_arm64.deb")}
              },
              "windows": {
                "x64": {"portable": $(archivo zip "cforge-${VERSION}-windows-x64.zip")}
              }
            },
            "editor": {
              "vscode": {"vsix": $(archivo vsix "c-forge-${VERSION}.vsix"), "marketplace": null}
            },
            "sha256sums": "${BASE}/SHA256SUMS"
          }
          EOF
          python3 -m json.tool release-assets/release-manifest.json >/dev/null
          cat > release-assets/latest.json <<EOF
          {
            "version": "${VERSION}",
            "released_at": "${DATE}",
            "manifest": "${BASE}/release-manifest.json"
          }
          EOF

      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ env.VERSION }}"
          gh release create "v${VERSION}" --target "${GITHUB_SHA}" \
            release-assets/cforge-${VERSION}-linux-x64.tar.gz \
            release-assets/cforge-${VERSION}-linux-arm64.tar.gz \
            release-assets/cforge_${VERSION}_amd64.deb \
            release-assets/cforge_${VERSION}_arm64.deb \
            release-assets/cforge-${VERSION}-macos-arm64.tar.gz \
            release-assets/cforge-${VERSION}-macos-x64.tar.gz \
            release-assets/cforge-${VERSION}-windows-x64.zip \
            "release-assets/c-forge-${VERSION}.vsix" \
            release-assets/SHA256SUMS \
            release-assets/release-manifest.json \
            release-assets/latest.json \
            --title "C-Forge v${VERSION}" \
            --generate-notes \
            --latest
