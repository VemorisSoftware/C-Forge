name: CI — C-Forge

on:
  push:
    branches: [main, dev, "trabajo/**"]
  pull_request:

permissions:
  contents: read

jobs:
  # ── Gate completo en Linux: 100 % C-Forge, sin C++ ni libc ──────────────────
  # La semilla (bootstrap/semilla/cforge-linux-x64) compila cforge; cforge se
  # compila a sí mismo (Stage 2 = Stage 3) y pasa toda la suite. macOS y
  # Windows tienen sus workflows nativos (macos-nativo.yml, windows-nativo.yml).
  linux:
    name: Linux x64 (release-check, 100 % C-Forge)
    runs-on: ubuntu-latest
    # Bases de datos reales para los clientes nativos (tests/sql).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cforge
          POSTGRES_PASSWORD: secreto
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cforge" --health-interval 2s --health-timeout 5s --health-retries 30
      mariadb:
        image: mariadb:11
        env:
          MARIADB_USER: cforge
          MARIADB_PASSWORD: secreto
          MARIADB_DATABASE: prueba
          MARIADB_ROOT_PASSWORD: raiz
        ports: ["3306:3306"]
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 2s --health-timeout 5s --health-retries 30
      # MySQL 8: caching_sha2_password con autenticación completa (RSA-OAEP).
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: cforge
          MYSQL_PASSWORD: secreto
          MYSQL_DATABASE: prueba
          MYSQL_ROOT_PASSWORD: raiz
        ports: ["3307:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -praiz" --health-interval 2s --health-timeout 5s --health-retries 60
    steps:
      - uses: actions/checkout@v4

      - name: Bibliotecas para extern, SDL y el servidor HTTP de los ejemplos
        run: sudo apt-get update -qq && sudo apt-get install -y libsdl2-2.0-0 libsqlite3-0 curl

      - name: Sin C++ en el repositorio
        run: |
          if git ls-files | grep -E '\.(cpp|cc|cxx|hpp|h)$'; then echo "✗ hay código C/C++"; exit 1; fi
          echo "✓ 100 % C-Forge: sin archivos C/C++"

      - name: Gate completo (semilla → cforge, Stage 2 = Stage 3, suite, stdlib, CLI)
        run: env -u CXX make release-check

      - name: OpenGL 3.3 (SDL2 + Mesa llvmpipe sobre Xvfb)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-2.0-0 libgl1-mesa-dri xvfb >/dev/null
          xvfb-run -a -s "-screen 0 640x480x24" env LIBGL_ALWAYS_SOFTWARE=1 CFORGE_STDLIB="$PWD/stdlib" ./cforge tests/gl/prueba.cfv | diff -u tests/gl/prueba.salida -

      - name: SDL2 (ventana, texturas sin SDL_image, texto y audio real)
        run: |
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=disk SDL_DISKAUDIOFILE=/tmp/cforge-audio.raw CFORGE_STDLIB="$PWD/stdlib" ./cforge tests/sdl/prueba.cfv | diff -u tests/sdl/prueba.salida -
          python3 -c "import struct; d=open('/tmp/cforge-audio.raw','rb').read(); s=struct.unpack('<%dh' % (len(d)//2), d); n=sum(1 for v in s if v); print('muestras de audio:', n); assert n > 15000"
          xvfb-run -a -s "-screen 0 640x480x24" env CFORGE_STDLIB="$PWD/stdlib" ./cforge tests/sdl/prueba.cfv > /dev/null 2>&1 || true

      - name: Red (HTTP, UDP, Redis, DNS) y HTTPS con OpenSSL
        env:
          CFORGE_TLS_INTERNET: "1"
        run: CFORGE_STDLIB="$PWD/stdlib" python3 tests/red/prueba.py ./cforge

      - name: PostgreSQL (SCRAM-SHA-256) y MariaDB con los clientes nativos
        run: CFORGE_STDLIB="$PWD/stdlib" ./cforge tests/sql/prueba.cfv 5432 3306 | diff -u tests/sql/prueba.salida -

      - name: MySQL 8 (caching_sha2_password, autenticación completa RSA)
        run: |
          sleep 5
          CFORGE_STDLIB="$PWD/stdlib" ./cforge tests/sql/prueba.cfv 5432 3307 | diff -u tests/sql/prueba.salida -

      - name: SQLite completo (transacciones anidadas, BLOB, pool, inyección)
        run: |
          d=$(mktemp -d); raiz=$PWD
          (cd "$d" && CFORGE_STDLIB="$raiz/stdlib" "$raiz/cforge" "$raiz/tests/db/completa.cfv") | grep -q '^\[OK\]'
          (cd "$d" && "$raiz/cforge" build "$raiz/tests/db/completa.cfv" --release -o c && CFORGE_STDLIB="$raiz/stdlib" ./c) | grep -q '^\[OK\]'
          echo "✓ SQLite completo (interpretado y --release)"

      - name: Seguridad (paquetes, parser, HTTP smuggling, Slowloris, WebSocket)
        run: python3 tests/seguridad/ataques.py ./cforge

      - name: Verificar CLI
        run: |
          ./cforge --version
          ./cforge --help

  # ── Sitio c-forge.org: todo lo que muestra debe ser verdad ──────────────────
  sitio:
    name: Sitio c-forge.org
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cforge desde la semilla
        run: make build

      - name: Ejecutar ejemplos y verificar páginas generadas
        run: sh site/verificar.sh ./cforge

  # ── Docker build ────────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cforge:ci .

      - name: Test Docker image
        run: |
          echo 'mostrar("Docker OK")' > /tmp/docker_test.cfv
          docker run --rm -v /tmp:/work \
            --entrypoint cforge cforge:ci \
            /work/docker_test.cfv
